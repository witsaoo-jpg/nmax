<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <title>บันทึก Service ยานพาหนะ (Local)</title>
  
  <style>
    /* เพิ่ม Font ภาษาไทยที่ดูดี */
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap');
    body {
      font-family: 'Sarabun', sans-serif;
    }
    /* สไตล์สำหรับปุ่มฟิลเตอร์ที่ "Active" */
    .filter-active {
      background-color: #2563eb; /* bg-blue-600 */
      color: white;
      font-weight: 500;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-gray-100 min-h-screen flex flex-col justify-between">

  <!-- Main Content -->
  <main class="flex-grow">
    <div class="container mx-auto max-w-lg p-4 sm:p-6 w-full">
      
      <!-- Card -->
      <div class="bg-white/80 backdrop-blur-sm rounded-xl shadow-xl border border-gray-200/50 p-6 sm:p-8 mt-8 sm:mt-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
          <svg class="mx-auto h-12 w-auto text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
          </svg>
          <h1 class="text-3xl font-bold text-gray-900 mt-2">บันทึก Service</h1>
          <p class="text-gray-500">กรอกรายละเอียดการบำรุงรักษารถ</p>
        </div>
        
        <!-- Form -->
        <form id="serviceForm" class="space-y-5">

          <!-- NEW: Vehicle Type -->
          <div>
            <label class="block text-sm font-medium text-gray-700">ประเภทรถ</label>
            <fieldset class="mt-2">
              <div class="flex gap-4">
                <div class="flex items-center">
                  <input id="typeMotorcycle" name="vehicleType" type="radio" value="motorcycle" checked class="h-4 w-4 border-gray-300 text-blue-600 focus:ring-blue-500">
                  <label for="typeMotorcycle" class="ml-2 block text-sm text-gray-900">🏍️ มอเตอร์ไซต์</label>
                </div>
                <div class="flex items-center">
                  <input id="typeCar" name="vehicleType" type="radio" value="car" class="h-4 w-4 border-gray-300 text-blue-600 focus:ring-blue-500">
                  <label for="typeCar" class="ml-2 block text-sm text-gray-900">🚗 รถยนต์</label>
                </div>
              </div>
            </fieldset>
          </div>
          
          <!-- รายการ (Dynamic) -->
          <div>
            <label for="item" class="block text-sm font-medium text-gray-700">รายการบำรุงรักษา</label>
            <select id="item" name="item" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-transparent focus:ring-2 focus:ring-blue-500 p-3 bg-white/50">
              <option value="" disabled selected>-- เลือกประเภทรถก่อน --</option>
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>
          
          <!-- NEW: Date Time -->
          <div>
            <label for="serviceDate" class="block text-sm font-medium text-gray-700">วันที่และเวลาที่ Service</label>
            <input type="datetime-local" id="serviceDate" name="serviceDate" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-transparent focus:ring-2 focus:ring-blue-500 p-3 bg-white/50">
          </div>
          
          <!-- เลขไมล์ -->
          <div>
            <label for="mileage" class="block text-sm font-medium text-gray-700">เลขไมล์ (กม.)</label>
            <input type="number" id="mileage" name="mileage" required placeholder="เช่น 15000" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-transparent focus:ring-2 focus:ring-blue-500 p-3 bg-white/50">
          </div>
          
          <!-- ร้านรถ -->
          <div>
            <label for="shop" class="block text-sm font-medium text-gray-700">ร้านที่ทำ (ถ้ามี)</label>
            <input type="text" id="shop" name="shop" placeholder="เช่น ร้านช่าง A ใกล้บ้าน" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-transparent focus:ring-2 focus:ring-blue-500 p-3 bg-white/50">
          </div>
          
          <!-- หมายเหตุ -->
          <div>
            <label for="notes" class="block text-sm font-medium text-gray-700">หมายเหตุ (ถ้ามี)</label>
            <textarea id="notes" name="notes" rows="3" placeholder="เช่น เปลี่ยนน้ำมันเครื่องยี่ห้อ..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-transparent focus:ring-2 focus:ring-blue-500 p-3 bg-white/50"></textarea>
          </div>
          
          <!-- ปุ่ม Submit -->
          <div>
            <button type="submit" id="submitButton" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-150 ease-in-out transform hover:-translate-y-0.5 active:scale-95">
              <!-- ไอคอน loading (ซ่อนไว้ก่อน) -->
              <svg id="loadingIcon" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span id="buttonText">บันทึกข้อมูล</span>
            </button>
          </div>
          
          <!-- NEW: Cancel Edit Button (hidden by default) -->
          <div>
            <button type="button" id="cancelEditButton" class="w-full flex justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-lg font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-150 ease-in-out hidden mt-3">
              ยกเลิกการแก้ไข
            </button>
          </div>
          
        </form>
      </div>
      
      <!-- 
        *** SECTION: History Report *** -->
      <div class="bg-white/80 backdrop-blur-sm rounded-xl shadow-xl border border-gray-200/50 p-6 sm:p-8 mt-10 mb-10">
        
        <!-- History Header -->
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
          <h2 class="text-2xl font-bold text-gray-900 flex-shrink-0">ประวัติการบำรุงรักษา</h2>
          <button id="reloadButton" title="โหลดข้อมูลใหม่" class="sm:hidden p-2 rounded-full text-gray-500 hover:bg-gray-100 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <svg id="reloadIcon" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0 0v-4.992m0 0h-4.992" />
            </svg>
            <svg id="historyLoadingIcon" class="animate-spin h-6 w-6 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>

        <!-- NEW: Filter Buttons -->
        <div class="flex items-center gap-2 mb-6">
          <span class="text-sm font-medium text-gray-600">แสดง:</span>
          <div class="flex-grow flex gap-2">
            <button id="filterAll" class="filter-btn filter-active text-sm px-3 py-1 rounded-full border border-gray-300 bg-gray-100 hover:bg-gray-200 transition-all">
              ทั้งหมด
            </button>
            <button id="filterMotorcycle" class="filter-btn text-sm px-3 py-1 rounded-full border border-gray-300 bg-gray-100 hover:bg-gray-200 transition-all">
              🏍️ มอเตอร์ไซต์
            </button>
            <button id="filterCar" class="filter-btn text-sm px-3 py-1 rounded-full border border-gray-300 bg-gray-100 hover:bg-gray-200 transition-all">
              🚗 รถยนต์
            </button>
          </div>
           <button id="reloadButtonDesktop" title="โหลดข้อมูลใหม่" class="hidden sm:block p-2 rounded-full text-gray-500 hover:bg-gray-100 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <svg id="reloadIconDesktop" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0 0v-4.992m0 0h-4.992" />
            </svg>
            <svg id="historyLoadingIconDesktop" class="animate-spin h-6 w-6 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>


        <!-- History Content Container -->
        <div id="historyContainer" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
          <!-- History items will be injected here by JavaScript -->
          <!-- Loading State Example -->
          <div id="historyInitialLoading" class="text-center text-gray-500 py-4">
            <p>กำลังโหลดข้อมูลประวัติ...</p>
          </div>
        </div>
        
      </div>
      <!-- *** END NEW SECTION *** -->
      
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center p-6 text-gray-500 text-sm">
    &copy; copyright 2025 by witsao oya@
  </footer>
  
  
    <!-- JavaScript สำหรับ Form -->
  <script>
    // --- START: Local Storage Logic ---
    
    // ตั้งชื่อ Key สำหรับ Local Storage
    const STORAGE_KEY = 'motorcycleHistory'; // เรายังใช้ชื่อเดิมได้

    /**
     * ฟังก์ชันสำหรับบันทึกข้อมูลลง Local Storage
     */
    function logMotorcycleService(formData) {
      return new Promise((resolve, reject) => {
        try {
          // 1. ดึงข้อมูลเก่า (ถ้ามี)
          const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          
          // 2. สร้างข้อมูลใหม่
          const newEntry = {
            id: crypto.randomUUID(),
            timestamp: new Date(formData.serviceDate).toISOString(), // <-- UPDATED
            vehicleType: formData.vehicleType, // <-- NEW
            item: formData.item,
            mileage: formData.mileage,
            shop: formData.shop,
            notes: formData.notes
          };
          
          // 3. เพิ่มข้อมูลใหม่
          history.push(newEntry);
          
          // 4. บันทึกกลับลง Local Storage
          localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
          
          // 5. ส่งสัญญาณว่าสำเร็จ
          resolve({ status: "success", message: "บันทึกข้อมูลเรียบร้อย!" });
          
        } catch (error) {
          // 6. ส่งสัญญาณว่าล้มเหลว
          reject({ status: "error", message: error.message });
        }
      });
    }

    /**
     * ฟังก์ชันสำหรับดึงข้อมูลประวัติจาก Local Storage
     */
    function getServiceHistory() {
       return new Promise((resolve, reject) => {
        try {
          const historyData = localStorage.getItem(STORAGE_KEY);
          // ส่งข้อมูล (ที่เป็น JSON string) กลับไปให้ renderHistory
          resolve(historyData); 
        } catch (error) {
          reject({ message: error.message });
        }
       });
    }
    
    /**
     * ฟังก์ชันสำหรับอัปเดตข้อมูลใน Local Storage
     */
    function updateMotorcycleService(id, formData) {
      return new Promise((resolve, reject) => {
        try {
          const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          
          // 3. วนหาและอัปเดตข้อมูล
          const updatedHistory = history.map(entry => {
            if (entry.id === id) {
              // ถ้าเจอ ID ที่ตรงกัน, อัปเดตข้อมูล แต่ยังคง ID และ timestamp เดิม
              return {
                id: entry.id,
                timestamp: new Date(formData.serviceDate).toISOString(), // <-- UPDATED
                vehicleType: formData.vehicleType, // <-- NEW
                item: formData.item,
                mileage: formData.mileage,
                shop: formData.shop,
                notes: formData.notes
              };
            }
            return entry; // คืนค่าตัวเดิมถ้า ID ไม่ตรง
          });
          
          // 4. บันทึกกลับลง Local Storage
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedHistory));
          
          // 5. ส่งสัญญาณว่าสำเร็จ
          resolve({ status: "success", message: "อัปเดตข้อมูลเรียบร้อย!" });
          
        } catch (error) {
          // 6. ส่งสัญญาณว่าล้มเหลว
          reject({ status: "error", message: error.message });
        }
      });
    }
    
    // --- END: Local Storage Logic ---
    
    // --- NEW: Vehicle Data ---
    const vehicleItems = {
      motorcycle: [
        'น้ำมันเครื่อง',
        'น้ำมันเฟืองท้าย',
        'ไส้กรองอากาศ',
        'หัวเทียน',
        'ล้างชุดข้าง',
        'แบตเตอรี่',
        'ผ้าเบรค',
        'สายพาน',
        'น้ำยาหม้อน้ำ',
        'อื่นๆ'
      ],
      car: [
        'น้ำมันเครื่อง',
        'กรองน้ำมันเครื่อง',
        'ไส้กรองอากาศ',
        'กรองแอร์',
        'แบตเตอรี่',
        'ผ้าเบรค',
        'ยางรถยนต์',
        'น้ำยาหม้อน้ำ',
        'หัวเทียน',
        'เช็คช่วงล่าง',
        'อื่นๆ'
      ]
    };

    // --- DOM Elements ---
    const form = document.getElementById('serviceForm');
    const submitButton = document.getElementById('submitButton');
    const buttonText = document.getElementById('buttonText');
    const loadingIcon = document.getElementById('loadingIcon');
    const cancelEditButton = document.getElementById('cancelEditButton');
    
    const reloadButton = document.getElementById('reloadButton');
    const reloadIcon = document.getElementById('reloadIcon');
    const historyLoadingIcon = document.getElementById('historyLoadingIcon');
    
    const reloadButtonDesktop = document.getElementById('reloadButtonDesktop');
    const reloadIconDesktop = document.getElementById('reloadIconDesktop');
    const historyLoadingIconDesktop = document.getElementById('historyLoadingIconDesktop');
    
    const historyContainer = document.getElementById('historyContainer');
    const historyInitialLoading = document.getElementById('historyInitialLoading');
    const itemSelect = document.getElementById('item');
    
    const vehicleTypeRadios = document.querySelectorAll('input[name="vehicleType"]');
    
    const filterAllBtn = document.getElementById('filterAll');
    const filterMotorcycleBtn = document.getElementById('filterMotorcycle');
    const filterCarBtn = document.getElementById('filterCar');

    // --- Global State ---
    let currentEditId = null; 
    let currentVehicleType = 'motorcycle'; // Default
    let currentFilter = 'all'; // Default
    
    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('serviceDate').value = new Date(Date.now() - (new Date().getTimezoneOffset() * 60000)).toISOString().slice(0, 16); // <-- NEW
      populateItemDropdown();
      fetchHistory();
    });
    
    reloadButton.addEventListener('click', fetchHistory);
    reloadButtonDesktop.addEventListener('click', fetchHistory);
    cancelEditButton.addEventListener('click', resetFormState);
    
    vehicleTypeRadios.forEach(radio => {
      radio.addEventListener('change', handleVehicleTypeChange);
    });
    
    filterAllBtn.addEventListener('click', () => handleFilterChange('all'));
    filterMotorcycleBtn.addEventListener('click', () => handleFilterChange('motorcycle'));
    filterCarBtn.addEventListener('click', () => handleFilterChange('car'));

    form.addEventListener('submit', async function(e) {
      e.preventDefault(); 
      
      const item = itemSelect.value;
      const mileage = document.getElementById('mileage').value;
      const serviceDate = document.getElementById('serviceDate').value; // <-- NEW
      
      if (!item || !mileage || !serviceDate) { // <-- UPDATED
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบ',
          text: 'กรุณากรอก "วันที่", "รายการ" และ "เลขไมล์" ด้วยครับ', // <-- UPDATED
        });
        return;
      }

      setLoading(true);

      const formData = {
        vehicleType: currentVehicleType, // <-- NEW
        serviceDate: serviceDate, // <-- NEW
        item: item,
        mileage: mileage,
        shop: document.getElementById('shop').value,
        notes: document.getElementById('notes').value,
      };

      try {
        let result;
        if (currentEditId) {
          result = await updateMotorcycleService(currentEditId, formData);
        } else {
          result = await logMotorcycleService(formData);
        }
        handleSuccess(result);
      } catch (error) {
        handleFailure(error);
      }
    });

    // --- Form & State Functions ---

    /**
     * NEW: จัดการการเปลี่ยนประเภทรถ
     */
    function handleVehicleTypeChange(e) {
      currentVehicleType = e.target.value;
      populateItemDropdown();
    }
    
    /**
     * NEW: เติม Dropdown รายการ
     */
    function populateItemDropdown() {
      const items = vehicleItems[currentVehicleType] || [];
      itemSelect.innerHTML = ''; // Clear old options
      
      // Add default disabled option
      const defaultOption = document.createElement('option');
      defaultOption.value = "";
      defaultOption.textContent = "-- เลือกรายการ --";
      defaultOption.disabled = true;
      defaultOption.selected = true;
      itemSelect.appendChild(defaultOption);
      
      // Add items
      items.forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        itemSelect.appendChild(option);
      });
    }
    
    /**
     * NEW: จัดการการเปลี่ยนฟิลเตอร์
     */
    function handleFilterChange(filter) {
      currentFilter = filter;
      
      // Update button styles
      [filterAllBtn, filterMotorcycleBtn, filterCarBtn].forEach(btn => {
        btn.classList.remove('filter-active', 'bg-blue-600', 'text-white', 'font-medium');
        btn.classList.add('bg-gray-100', 'hover:bg-gray-200');
      });
      
      let activeBtn = filterAllBtn;
      if (filter === 'motorcycle') activeBtn = filterMotorcycleBtn;
      if (filter === 'car') activeBtn = filterCarBtn;
      
      activeBtn.classList.add('filter-active');
      activeBtn.classList.remove('bg-gray-100', 'hover:bg-gray-200');
      
      // Re-render history (no need to fetch again)
      renderHistory(localStorage.getItem(STORAGE_KEY));
    }

    /**
     * ฟังก์ชันเมื่อบันทึกสำเร็จ
     */
    function handleSuccess(result) {
      setLoading(false);
      
      if (result.status === 'success') {
        Swal.fire({
          icon: 'success',
          title: currentEditId ? 'แก้ไขสำเร็จ!' : 'บันทึกสำเร็จ!',
          text: currentEditId ? 'ข้อมูลของคุณถูกอัปเดตแล้ว' : 'ข้อมูลถูกบันทึกลงในเบราว์เซอร์นี้แล้ว',
          timer: 2000,
          showConfirmButton: false
        });
        
        resetFormState();
        fetchHistory(); // โหลดประวัติใหม่
        
      } else {
        handleFailure({ message: result.message });
      }
    }

    /**
     * ฟังก์ชันเมื่อเกิดข้อผิดพลาด
     */
    function handleFailure(error) {
      setLoading(false);
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message,
      });
    }

    /**
     * ฟังก์ชันควบคุมสถานะปุ่ม Loading
     */
    function setLoading(isLoading) {
      if (isLoading) {
        submitButton.disabled = true;
        submitButton.classList.add('bg-blue-400', 'cursor-not-allowed');
        buttonText.textContent = currentEditId ? 'กำลังอัปเดต...' : 'กำลังบันทึก...';
        loadingIcon.classList.remove('hidden');
      } else {
        submitButton.disabled = false;
        submitButton.classList.remove('bg-blue-400', 'cursor-not-allowed');
        buttonText.textContent = currentEditId ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูล';
        loadingIcon.classList.add('hidden');
      }
    }
    
    /**
     * ฟังก์ชัน: ตั้งค่าสถานะ Loading-History
     */
    function setHistoryLoading(isLoading) {
      if (isLoading) {
        reloadIcon.classList.add('hidden');
        historyLoadingIcon.classList.remove('hidden');
        reloadButton.disabled = true;
        
        reloadIconDesktop.classList.add('hidden');
        historyLoadingIconDesktop.classList.remove('hidden');
        reloadButtonDesktop.disabled = true;
      } else {
        reloadIcon.classList.remove('hidden');
        historyLoadingIcon.classList.add('hidden');
        reloadButton.disabled = false;
        
        reloadIconDesktop.classList.remove('hidden');
        historyLoadingIconDesktop.classList.add('hidden');
        reloadButtonDesktop.disabled = false;
      }
    }

    /**
     * ฟังก์ชัน: เรียกดึงข้อมูลประวัติ
     */
    async function fetchHistory() {
      setHistoryLoading(true);
      
      const loadingDiv = document.getElementById('historyInitialLoading');
      
      historyContainer.innerHTML = '';
      if (loadingDiv) {
        loadingDiv.classList.remove('hidden');
        loadingDiv.textContent = 'กำลังโหลดข้อมูลประวัติ...';
        historyContainer.appendChild(loadingDiv);
      } else {
         historyContainer.innerHTML = '<p class="text-center text-gray-500 py-4">กำลังโหลดข้อมูลประวัติ...</p>';
      }
      
      try {
        const historyDataString = await getServiceHistory();
        renderHistory(historyDataString); // ส่ง JSON string ไปให้ renderHistory
      } catch (error) {
        handleHistoryFailure(error);
      }
    }
    
    /**
     * ฟังก์ชัน: แสดงผลข้อมูลประวัติที่ดึงมา
     */
    function renderHistory(responseString) {
      setHistoryLoading(false);
      historyContainer.innerHTML = ''; 
      
      let data = JSON.parse(responseString || '[]');

      if (data.length === 0) {
        historyContainer.innerHTML = '<p class="text-center text-gray-500 py-4">ยังไม่มีข้อมูลการบำรุงรักษา</p>';
        return;
      }
      
      // --- START: DATA MIGRATION FIX (Updated) ---
      // ตรวจสอบข้อมูลว่ามี ID หรือ vehicleType หรือไม่
      let needsSave = false;
      data = data.map(entry => {
        const hasId = entry.hasOwnProperty('id') && entry.id;
        const hasType = entry.hasOwnProperty('vehicleType') && entry.vehicleType;
        
        if (!hasId || !hasType) {
          needsSave = true;
          return {
            ...entry,
            id: entry.id || crypto.randomUUID(), // เติม ID ที่หายไป
            vehicleType: entry.vehicleType || 'motorcycle', // <-- NEW: ข้อมูลเก่าทั้งหมดให้เป็น motorcycle
            timestamp: entry.timestamp ? new Date(entry.timestamp).toISOString() : new Date().toISOString()
          };
        }
        return entry;
      });
      
      if (needsSave) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          console.log('Data migration completed for vehicleType.');
        } catch (e) {
          console.error("Error migrating data:", e);
        }
      }
      // --- END: DATA MIGRATION FIX ---
      
      // --- NEW: FILTER DATA ---
      let filteredData = data;
      if (currentFilter !== 'all') {
        filteredData = data.filter(entry => entry.vehicleType === currentFilter);
      }
      
      if (filteredData.length === 0) {
        historyContainer.innerHTML = `<p class="text-center text-gray-500 py-4">ไม่พบข้อมูลสำหรับ "${currentFilter}"</p>`;
        return;
      }
      
      // แสดงผล โดยเรียงจากใหม่สุดไปเก่าสุด
      historyContainer.innerHTML = filteredData.reverse().map(entry => {
        const { id, timestamp, vehicleType, item, mileage, shop, notes } = entry;
        
        const date = new Date(timestamp);
        
        const formattedDate = date.toLocaleDateString('th-TH', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });

        const formattedMileage = Number(mileage).toLocaleString('th-TH');
        const icon = vehicleType === 'car' ? '🚗' : '🏍️';

        // สร้าง HTML Card
        return `
          <div class="border border-gray-200/80 rounded-lg p-4 shadow-sm bg-white transition-colors duration-150">
            <div class="flex justify-between items-start gap-2">
              <h3 class="text-lg font-semibold text-blue-700 break-words">${icon} ${item}</h3>
              <span class="text-sm text-gray-600 whitespace-nowrap flex-shrink-0">${formattedDate} น.</span>
            </div>
            
            <p class="text-gray-800 font-medium mt-1">เลขไมล์: ${formattedMileage} กม.</p>
            
            ${shop ? `<p class="text-sm text-gray-600 mt-1 break-words"><b>ร้าน:</b> ${shop}</p>` : ''}
            ${notes ? `<p class="text-sm text-gray-600 mt-1 break-words"><b>หมายเหตุ:</b> ${notes}</p>` : ''}
            
            <!-- Edit/Delete Buttons -->
            <div class="flex justify-end gap-3 mt-4 pt-3 border-t border-gray-100">
              <button onclick="showEditForm('${id}')" class="flex items-center text-sm font-medium text-blue-600 hover:text-blue-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                แก้ไข
              </button>
              <button onclick="deleteEntry('${id}')" class="flex items-center text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                ลบ
              </button>
            </div>
          </div>
        `;
      }).join('');
    }
    
    /**
     * ฟังก์ชัน: จัดการเมื่อดึงข้อมูลประวัติไม่สำเร็จ
     */
    function handleHistoryFailure(error) {
      setHistoryLoading(false);
      historyContainer.innerHTML = `
        <div class="text-center text-red-500 py-4 bg-red-50 rounded-lg border border-red-200">
          <p><b>เกิดข้อผิดพลาดในการโหลดข้อมูล</b></p>
          <p class="text-sm">${error.message}</p>
        </div>
      `;
    }
    
    // --- CRUD HELPER FUNCTIONS ---
    
    /**
     * ฟังก์ชันสำหรับลบข้อมูล
     */
    function deleteEntry(id) {
      Swal.fire({
        title: 'คุณแน่ใจหรือไม่?',
        text: "คุณจะไม่สามารถกู้คืนข้อมูลนี้ได้!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'ใช่, ลบเลย!',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          try {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const updatedHistory = history.filter(entry => entry.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedHistory));
            
            Swal.fire(
              'ลบแล้ว!',
              'รายการของคุณถูกลบเรียบร้อย',
              'success'
            );
            
            fetchHistory(); // โหลดประวัติใหม่
            resetFormState(); // เผื่อกำลังแก้ไขรายการที่เพิ่งลบ
          
          } catch (error) {
            handleFailure(error);
          }
        }
      });
    }

    /**
     * ฟังก์ชันสำหรับแสดงข้อมูลในฟอร์มเพื่อแก้ไข
     */
    function showEditForm(id) {
      try {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const entryToEdit = history.find(entry => entry.id === id);
        
        if (entryToEdit) {
          currentEditId = id;
          
          // --- NEW: Set vehicle type first ---
          const vehicleType = entryToEdit.vehicleType || 'motorcycle'; // Default old data
          currentVehicleType = vehicleType;
          document.getElementById(vehicleType === 'car' ? 'typeCar' : 'typeMotorcycle').checked = true;
          
          // --- NEW: Populate correct dropdown BEFORE setting value ---
          populateItemDropdown();
          
          // --- NEW: Format and set datetime-local value ---
          // 1. Get the saved ISO string timestamp
          const savedTimestamp = entryToEdit.timestamp;
          // 2. Convert to Date object, then to a "local" ISO string by slicing
          // We need YYYY-MM-DDTHH:mm
          const date = new Date(savedTimestamp);
          const localISOTime = new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
          document.getElementById('serviceDate').value = localISOTime;
          
          // เติมข้อมูลลงในฟอร์ม
          itemSelect.value = entryToEdit.item;
          document.getElementById('mileage').value = entryToEdit.mileage;
          document.getElementById('shop').value = entryToEdit.shop;
          document.getElementById('notes').value = entryToEdit.notes;
          
          // เปลี่ยนปุ่ม
          buttonText.textContent = 'บันทึกการแก้ไข';
          submitButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          submitButton.classList.add('bg-green-600', 'hover:bg-green-700'); // เปลี่ยนเป็นสีเขียว
          cancelEditButton.classList.remove('hidden'); // แสดงปุ่มยกเลิก
          
          // เลื่อนจอขึ้นไปที่ฟอร์ม
          form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          throw new Error('ไม่พบรายการที่ต้องการแก้ไข');
        }
      } catch (error) {
         handleFailure(error);
      }
    }
    
    /**
     * ฟังก์ชันสำหรับรีเซ็ตฟอร์ม
     */
    function resetFormState() {
      form.reset();
      currentEditId = null;
      
      // --- NEW: Reset serviceDate to current time ---
      document.getElementById('serviceDate').value = new Date(Date.now() - (new Date().getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      
      // --- NEW: Reset to default vehicle type ---
      currentVehicleType = 'motorcycle';
      document.getElementById('typeMotorcycle').checked = true;
      populateItemDropdown();
      
      buttonText.textContent = 'บันทึกข้อมูล';
      submitButton.classList.remove('bg-green-600', 'hover:bg-green-700');
      submitButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
      cancelEditButton.classList.add('hidden');
    }
    
  </script>

</body>
